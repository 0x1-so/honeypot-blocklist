<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honeypot Blocklist</title>
<meta name="description" content="Hourly list of IPs that attacked our honeypot sensors in the last 30 days.">
<style>
:root {
  --bg: #f7f8fa; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #e3e6ea;
  --accent: #0b6bcb; --red: #c62f3a; --amber: #a66300; --chip: #eef1f4;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1116; --panel: #161b22; --text: #e6e9ee; --muted: #9aa4b2; --line: #262d36;
          --accent: #58a6ff; --red: #ff7b84; --amber: #e3a54a; --chip: #1f2630; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
.lang { display: flex; gap: 4px; flex: none; }
.lang button { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 4px 10px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; }
.lang button.on { color: var(--text); border-color: var(--accent); }
.sub { color: var(--muted); margin: 0 0 22px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 22px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.stat b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.stat a { color: var(--accent); font-size: 13px; text-decoration: none; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.bar input { flex: 1 1 220px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; }
.tabs button { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 7px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
.tabs button.on { color: var(--text); border-color: var(--accent); }
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: 0; }
td.ip { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--chip); }
.tag.attacker { color: var(--red); } .tag.infected-device { color: var(--amber); }
.act { color: var(--muted); }
.note { color: var(--muted); font-size: 13px; margin-top: 18px; }
.note a, .sub a { color: var(--accent); }
.empty { padding: 24px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Honeypot Blocklist</h1>
    <div class="lang" id="lang"><button data-l="zh">中文</button><button data-l="en">English</button></div>
  </div>
  <p class="sub"><span data-i18n="sub"></span> · <span id="updated"></span> · <a href="https://map.hsd0x1.cc" data-i18n="map"></a></p>

  <div class="stats">
    <div class="stat"><b id="n-att">–</b><span data-i18n="attackers"></span><br><a href="blocklist.txt">blocklist.txt</a></div>
    <div class="stat"><b id="n-dev">–</b><span data-i18n="devices"></span><br><a href="infected-devices.txt">infected-devices.txt</a></div>
    <div class="stat"><b id="n-smp">–</b><span data-i18n="samples"></span><br><a href="samples-sha256.txt">samples-sha256.txt</a></div>
    <div class="stat"><b>CSV</b><span data-i18n="details"></span><br><a href="attackers.csv">attackers.csv</a> · <a href="all.txt">all.txt</a></div>
  </div>

  <div class="bar">
    <div class="tabs" id="tabs">
      <button data-f="all" class="on" data-i18n="all"></button><button data-f="attacker" data-i18n="attackers"></button><button data-f="infected-device" data-i18n="devicesShort"></button>
    </div>
    <input id="q" type="search">
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr><th>IP</th><th data-i18n="colList"></th><th data-i18n="colAct"></th><th data-i18n="colCountry"></th><th>ASN</th><th data-i18n="colLast"></th><th data-i18n="colEvents"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p class="note" id="note"></p>
</div>
<script>
const T = {
  zh: {
    sub: '最近 30 天真正攻击过蜜罐的 IP，每小时自动更新', map: '实时攻击地图', loading: '加载中…',
    updated: d => `更新于 ${d.toLocaleString('zh-CN', { hour12: false })}`,
    attackers: '主动攻击源', devices: '疑似被感染的设备', devicesShort: '被感染设备', samples: '捕获的样本', details: '全部明细', all: '全部',
    search: '搜索 IP、国家、ASN…', colList: '类别', colAct: '攻击类型', colCountry: '国家', colLast: '最后出现', colEvents: '事件',
    none: '没有匹配的地址', nodata: '还没有数据，第一次生成后就会出现',
    act: { 'login': '登录爆破', 'shell-commands': '执行命令', 'malware-download': '下载木马', 'malware-upload': '上传文件', 'service-bruteforce': '服务撞库', 'tunnel': '端口转发' },
    list: { 'attacker': '主动攻击源', 'infected-device': '被感染设备' }, sep: '、',
    ago: s => s < 3600 ? `${Math.max(1, Math.floor(s / 60))} 分钟前` : s < 86400 ? `${Math.floor(s / 3600)} 小时前` : `${Math.floor(s / 86400)} 天前`,
    note: '只收录动了手的地址（登录爆破、执行命令、下载木马、对假服务撞库）；只做端口扫描和网页探测的不收录。“被感染设备”是根据网络类型和行为推断的，设备主人多半不知情。误列请<a href="https://github.com/0x1-so/honeypot-blocklist/issues">开 issue</a>。说明见 <a href="https://github.com/0x1-so/honeypot-blocklist/blob/main/README.zh-CN.md">README</a>。'
  },
  en: {
    sub: 'IPs that actually attacked our honeypots in the last 30 days, updated hourly', map: 'Live attack map', loading: 'Loading…',
    updated: d => `updated ${d.toLocaleString('en-GB', { hour12: false })}`,
    attackers: 'Attack sources', devices: 'Likely infected devices', devicesShort: 'Infected devices', samples: 'Captured samples', details: 'Full details', all: 'All',
    search: 'Search IP, country, ASN…', colList: 'List', colAct: 'Activity', colCountry: 'Country', colLast: 'Last seen', colEvents: 'Events',
    none: 'No matching addresses', nodata: 'No data yet. It appears after the first update.',
    act: { 'login': 'login brute force', 'shell-commands': 'shell commands', 'malware-download': 'malware download', 'malware-upload': 'file upload', 'service-bruteforce': 'service brute force', 'tunnel': 'port forwarding' },
    list: { 'attacker': 'attack source', 'infected-device': 'infected device' }, sep: ', ',
    ago: s => s < 3600 ? `${Math.max(1, Math.floor(s / 60))} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : `${Math.floor(s / 86400)} d ago`,
    note: 'Only addresses that actually attacked are listed (login brute force, shell commands, malware downloads, credential stuffing against fake services); port scans and web probes alone are not. “Infected devices” are inferred from network type and behaviour, and their owners usually don\'t know. Listed by mistake? <a href="https://github.com/0x1-so/honeypot-blocklist/issues">Open an issue</a>. Details in the <a href="https://github.com/0x1-so/honeypot-blocklist#readme">README</a>.'
  }
};
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let lang = store.get('lang') || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');
let data = null, filter = 'all';
const $ = id => document.getElementById(id);
const td = (text, cls) => { const e = document.createElement('td'); if (cls) e.className = cls; e.textContent = text; return e; };
const emptyRow = text => { const tr = document.createElement('tr'), c = td(text, 'empty'); c.colSpan = 7; tr.append(c); return tr; };

function applyLang() {
  const t = T[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t[e.dataset.i18n]; });
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  $('q').placeholder = t.search; $('q').setAttribute('aria-label', t.search);
  $('note').innerHTML = t.note;
  $('updated').textContent = data ? t.updated(new Date(data.generated)) : t.loading;
  render();
}

function render() {
  const t = T[lang], body = $('rows');
  body.replaceChildren();
  if (!data) { body.append(emptyRow(t.loading)); return; }
  const q = $('q').value.trim().toLowerCase();
  const rows = data.rows.filter(r => (filter === 'all' || r.list === filter) &&
    (!q || [r.ip, r.cc, r.country, r.asn].join(' ').toLowerCase().includes(q)));
  if (!rows.length) { body.append(emptyRow(t.none)); return; }
  for (const r of rows) {
    const tr = document.createElement('tr'), tag = document.createElement('span'), cat = td('');
    tag.className = `tag ${r.list}`; tag.textContent = t.list[r.list] || r.list; cat.append(tag);
    // the country name in data.json is Chinese; the English view shows the country code only
    const country = lang === 'zh' ? [r.cc, r.country].filter(Boolean).join(' ') : r.cc;
    tr.append(td(r.ip, 'ip'), cat, td(r.activity.map(a => t.act[a] || a).join(t.sep), 'act'),
      td(country || '—'), td(r.asn || '—'), td(t.ago((Date.now() - Date.parse(r.last)) / 1000)), td(String(r.events)));
    body.append(tr);
  }
}

$('lang').onclick = e => { const b = e.target.closest('button'); if (!b) return; lang = b.dataset.l; store.set('lang', lang); applyLang(); };
$('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); render();
};
$('q').oninput = render;
applyLang();
fetch('data.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
  data = d;
  $('n-att').textContent = d.counts.attacker; $('n-dev').textContent = d.counts['infected-device']; $('n-smp').textContent = d.counts.samples;
  applyLang();
}).catch(() => { $('rows').replaceChildren(emptyRow(T[lang].nodata)); });
</script>
</body>
</html>
